name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile main + unit-test sources
        run: |
          set +e
          ./gradlew --no-daemon --console=plain compileDebugUnitTestKotlin \
            > /tmp/compile.log 2>&1
          RC=$?
          grep -E "^e: |: error:|error: " /tmp/compile.log | head -80 | \
            while IFS= read -r l; do echo "::error::$l"; done
          if [ $RC -ne 0 ]; then
            echo "::error::Unit-test compilation failed (rc=$RC)"
            tail -80 /tmp/compile.log | while IFS= read -r l; do echo "::notice::$l"; done
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Log blobs are not always readable from automation; surface failures
      # as workflow-command annotations so they appear on the check run.
      - name: Publish unit-test failures as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          print(f"::notice::parsed {len(files)} test result files")
          if not files:
              print("::error::No unit-test result XML was produced — the test task likely failed to compile.")
          for f in files:
              root = ET.parse(f).getroot()
              for case in root.iter("testcase"):
                  fail = case.find("failure") or case.find("error")
                  if fail is not None:
                      cls = case.get("classname", "?")
                      name = case.get("name", "?")
                      detail = (fail.text or "").strip().splitlines()
                      detail = " | ".join(detail[:6])[:1200]
                      print(f"::error file=app/src/test/{cls.replace('.', '/')}.kt::{cls}.{name} failed :: {detail}")
              if int(root.get("failures", 0)) + int(root.get("errors", 0)) > 0:
                  print(f"::error::{root.get('name')}: {root.get('tests')} tests, "
                        f"{root.get('failures')} failures, {root.get('errors')} errors")
          PY

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        env:
          ORBIT_VERSION_CODE: ${{ github.run_number }}

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease
        env:
          ORBIT_VERSION_CODE: ${{ github.run_number }}

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/orbit-${{ github.run_number }}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "dist/orbit-${{ github.run_number }}-release.apk"
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-release-apk
          path: dist/*-release.apk
          if-no-files-found: error

      # Artifacts are only reachable to someone signed in to GitHub, so the same
      # APKs are also published as a release for a plain, shareable download link.
      - name: Publish APKs as a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "Orbit build ${{ github.run_number }}" \
            --notes "Automated build of \`${{ github.sha }}\` on \`${{ github.ref_name }}\`.
          Version code \`${{ github.run_number }}\`.

          Install **orbit-${{ github.run_number }}-release.apk** — it is the smaller,
          optimised build. It installs over any earlier Orbit build without an
          uninstall, so your notes, tasks and downloads survive the upgrade.

          Both APKs are signed with the keystore committed at \`app/orbit-ci.jks\`,
          which is what keeps the signature stable across builds. That key is public,
          so replace it with one you keep private before distributing this app to
          anyone else."
