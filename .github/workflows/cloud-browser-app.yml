name: Cloud Browser standalone app

on:
  push:
    branches: ["**"]
    paths:
      - "cloud-browser/**"
      - ".github/workflows/cloud-browser-app.yml"
  pull_request:
    paths:
      - "cloud-browser/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: cloud-browser

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile main + unit-test sources
        run: |
          set +e
          ./gradlew --no-daemon --console=plain compileDebugUnitTestKotlin \
            > /tmp/cb-compile.log 2>&1
          RC=$?
          grep -E "^e: |: error:|error: " /tmp/cb-compile.log | head -80 | \
            while IFS= read -r l; do echo "::error::$l"; done
          if [ $RC -ne 0 ]; then
            echo "::error::Standalone compilation failed (rc=$RC)"
            tail -80 /tmp/cb-compile.log | while IFS= read -r l; do echo "::notice::$l"; done
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Publish unit-test failures as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          print(f"::notice::parsed {len(files)} test result files")
          if not files:
              print("::error::No unit-test result XML was produced.")
          for f in files:
              root = ET.parse(f).getroot()
              for case in root.iter("testcase"):
                  fail = case.find("failure") or case.find("error")
                  if fail is not None:
                      cls = case.get("classname", "?")
                      name = case.get("name", "?")
                      detail = " | ".join((fail.text or "").strip().splitlines()[:6])[:1200]
                      print(f"::error::{cls}.{name} failed :: {detail}")
              if int(root.get("failures", 0)) + int(root.get("errors", 0)) > 0:
                  print(f"::error::{root.get('name')}: {root.get('tests')} tests, "
                        f"{root.get('failures')} failures, {root.get('errors')} errors")
          PY

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        env:
          CB_VERSION_CODE: ${{ github.run_number }}

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease
        env:
          CB_VERSION_CODE: ${{ github.run_number }}

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/cloud-browser-${{ github.run_number }}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "dist/cloud-browser-${{ github.run_number }}-release.apk"
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-browser-debug-apk
          path: cloud-browser/dist/*-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-browser-release-apk
          path: cloud-browser/dist/*-release.apk
          if-no-files-found: error
